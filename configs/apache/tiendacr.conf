# Reverse proxy :80 -> contenedor DVWA en 127.0.0.1:8080
# Permite registrar la IP real del cliente y anteponer ModSecurity en la remediacion.
<VirtualHost *:80>
    ServerName tiendacr.local
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ErrorLog  ${APACHE_LOG_DIR}/tiendacr_error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
